<title>みわけ図鑑</title>
<meta name="description" content="道路標識・地図記号・鉱物と岩石を、図鑑とクイズで見分けて覚えるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 図鑑のページ。白い紙にカード、なかまごとの色ラベル */
:root {
  --bg: #f6f4ee; --card: #ffffff; --ink: #23262f; --sub: #646a77; --line: #e3dfd4;
  --accent: #1f7a5a; --accent-soft: #e2f3ec; --ok: #2e8a5c; --ok-soft: #e3f4ea; --ng: #c8473d; --ng-soft: #fbe6e3; --gold: #d99a1e;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 14px; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; }
p { margin: 0; }
.muted { color: var(--sub); } .small { font-size: 13px; }
#app { max-width: 760px; margin: 0 auto; padding: 14px 16px 50px; display: grid; gap: 14px; }
.mast h1 { font-size: clamp(32px, 9vw, 48px); line-height: 1.1; } .mast h1 span { color: var(--accent); }
.decks { display: grid; gap: 12px; }
.deck { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.deck .ic { font-size: 34px; text-align: center; }
.deck b { font-family: var(--display); font-size: 20px; display: block; }
.bar { height: 8px; background: #ebe6da; border-radius: 4px; overflow: hidden; margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--accent); }
.topbar { display: flex; align-items: center; gap: 10px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mode { border: 1.5px solid var(--line); background: var(--card); border-radius: var(--r); padding: 14px; text-align: left; display: grid; gap: 2px; }
.mode b { font-family: var(--display); font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: #faf8f3; border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 12px; font-weight: 700; }
.tile img { width: 100%; aspect-ratio: 1; object-fit: contain; }
.tile.photo img { object-fit: cover; border-radius: 8px; }
.tile .st { color: var(--gold); font-size: 11px; }
.pic { width: min(240px, 70vw); aspect-ratio: 1; object-fit: contain; justify-self: center; background: #fff; border-radius: 12px; }
.pic.photo { object-fit: cover; }
.tag { justify-self: start; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.q { font-family: var(--display); font-size: 18px; font-weight: 800; text-align: center; }
.choices { display: grid; gap: 8px; }
.choices.pics { grid-template-columns: 1fr 1fr; }
.ch { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; text-align: left; font-size: 16px; font-weight: 700; }
.ch img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
.ch.photo img { object-fit: cover; border-radius: 8px; }
.ch.ok { border-color: var(--ok); background: var(--ok-soft); } .ch.ng { border-color: var(--ng); background: var(--ng-soft); }
.explain { background: #fffaf0; border-left: 4px solid var(--gold); padding: 8px 12px; border-radius: 6px; }
.primary { border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font-weight: 800; padding: 13px; font-size: 16px; }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 12px; font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--display); font-size: 44px; font-weight: 800; text-align: center; }
.credits { font-size: 12px; } .credits li { margin-bottom: 4px; word-break: break-all; }
</style>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
